[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihome-mac"
version = "0.1.0"
description = "米家设备的 macOS 桌面控制端，基于 mijiaAPI 构建"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "MiHome-Mac contributors" }]
dependencies = [
    "mijiaAPI>=4.2,<5",
    "qrcode>=8",
]

[tool.setuptools.packages.find]
include = ["app", "app.core"]
exclude = ["tests", "tests.*"]
